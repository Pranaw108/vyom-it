name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Cloudflare's documented Turnstile test keys (always pass). Not secrets.
      PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      PUBLIC_INDEXING: 'false'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      # Must exist before the build: the build copies .dev.vars into the preview output.
      - name: Local test secrets and database
        run: |
          printf 'TURNSTILE_SECRET=1x0000000000000000000000000000000AA\nIP_HASH_SALT=ci-salt\nRESEND_API_KEY=\nCSRF_SECRET=ci-csrf-secret\nDEV_ADMIN_EMAIL=owner@localhost.test\nINITIAL_OWNER_EMAIL=owner@localhost.test\nDEPLOY_HOOK_URL=\n' > .dev.vars
          npx wrangler d1 migrations apply vyom-website --local
          npm run seed:local

      - name: Build
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser and accessibility tests
        run: npm run test:e2e

      # Byte budgets and Lighthouse lab metrics. Reported on every run but not blocking:
      # shared CI machines vary in speed, so release sign-off uses a local run (docs/LAUNCH-CHECKLIST.md).
      - name: Performance budgets (report)
        continue-on-error: true
        run: |
          npx astro preview --port 4321 --host 127.0.0.1 > preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4321/ > /dev/null && break; sleep 1; done
          CHROME_PATH=$(which google-chrome) npm run test:perf

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
